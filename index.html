<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Kenny Adu Antwi · Portfolio</title>
  <meta name="description" content="Kenny Adu Antwi: Computer Science student at the University of Arkansas at Pine Bluff. Follow Kenny through projects, research, awards, and goals." />
  <meta name="theme-color" content="#1b2440" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />

  <!-- Sprite frames are the only images fetched up front. -->
  <link rel="preload" as="image" href="assets/character/webp/wave_01.webp" type="image/webp" />
  <link rel="preload" as="image" href="assets/character/webp/idle_01.webp" type="image/webp" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Orbitron:wght@600;800;900&family=Nunito:wght@500;700;800&family=Press+Start+2P&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/theme.css" />
</head>
<body class="journey-page">
  <!-- ===== The world (decorative, sits behind the scrolling sections) ===== -->
  <div class="world" id="world" aria-hidden="true">
    <div class="sky" id="sky"></div>
    <div class="sun" id="sun"></div>
    <div class="layer clouds" id="layer-clouds"></div>
    <canvas class="ambient" id="ambient"></canvas>
    <div class="layer hills-far" id="layer-far"></div>
    <div class="layer hills-near" id="layer-near"></div>
    <div class="track" id="track"></div>
    <div class="layer ground" id="layer-ground"><canvas id="floor" aria-hidden="true"></canvas></div>
    <canvas class="fx" id="fx"></canvas>
    <div class="kenny" id="kenny"><canvas id="kenny-canvas" width="420" height="640"></canvas></div>
    <div class="bubble" id="bubble"><span class="bubble-text" id="bubble-text"></span></div>
  </div>

  <!-- Screen-reader copy of what Kenny says -->
  <p class="sr-only" id="speech-live" aria-live="polite"></p>

  <!-- ===== HUD: checkpoint dots ===== -->
  <header class="hud">
    <a class="hud-logo" href="#start" aria-label="Back to start">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <defs>
          <linearGradient id="ka-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b1260"/><stop offset="1" stop-color="#0b0420"/></linearGradient>
          <linearGradient id="ka-chrome" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".45" stop-color="#7fe0ff"/><stop offset=".5" stop-color="#3a1f78"/><stop offset=".56" stop-color="#ff6ec7"/><stop offset="1" stop-color="#ffd36b"/></linearGradient>
          <linearGradient id="ka-edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7fe0ff"/><stop offset="1" stop-color="#ff3cac"/></linearGradient>
        </defs>
        <path d="M10 2H54L62 10V54L54 62H10L2 54V10Z" fill="url(#ka-bg)" stroke="url(#ka-edge)" stroke-width="2.5"/>
        <g stroke="#ff3cac" stroke-opacity=".35" stroke-width="1"><path d="M6 46H58M6 51H58M6 56H58"/></g>
        <text x="32" y="42" text-anchor="middle" font-family="Orbitron, 'Arial Black', sans-serif" font-weight="900" font-size="26" letter-spacing="-0.5" fill="url(#ka-chrome)" stroke="#0b0420" stroke-width=".6" paint-order="stroke">KA</text>
      </svg>
    </a>
    <nav class="dots" aria-label="Checkpoints">
      <div class="dots-rail"><div class="dots-fill" id="dots-fill"></div></div>
      <ol class="dots-list" id="dots"></ol>
    </nav>
    <button class="hud-sound" id="sound-btn" type="button" aria-label="Sound" aria-pressed="true">
      <svg class="ic-on" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3 9h4l5-4v14l-5-4H3z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <svg class="ic-off" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3 9h4l5-4v14l-5-4H3z"/><path d="M16 9l6 6M22 9l-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </header>

  <!-- ===== Journey: one full-screen, snapping section per checkpoint ===== -->
  <main class="journey" id="journey" tabindex="-1"></main>

  <!-- Project / award details pop-up -->
  <dialog class="modal" id="modal" aria-labelledby="modal-title"></dialog>

  <noscript>
    <div class="noscript">
      <h1>Kenny Adu Antwi</h1>
      <p>This portfolio needs JavaScript for the interactive journey.</p>
      <p><a href="https://github.com/kenshewrote">GitHub</a> · <a href="https://www.linkedin.com/in/kenny-adu-antwi/">LinkedIn</a> · <a href="kenny_adu_antwi_resume.pdf">Resume</a> · <a href="mailto:aduantk35745@uapb.edu">aduantk35745@uapb.edu</a></p>
    </div>
  </noscript>

  <script src="js/config.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/ambient.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
